name: Multi-Agent RAG CI

on:
  push:
    branches:
      - main
      - tatmanh
  pull_request:
    branches:
      - main
      - tatmanh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-and-m0-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONPATH: 'main:.'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system OCR (Tesseract EN + VI)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install pytest

      - name: Verify Python syntax across main and kaggle
        run: python -m compileall -q main kaggle

      - name: Validate Kaggle weights manifest JSON
        run: |
          python -c "
          import json, re
          with open('kaggle/weights_manifest.json', encoding='utf-8') as f:
              data = json.load(f)
          base = data.get('base_models') or {}
          assert len(base) >= 2, 'Expected base_models in manifest'
          for name, spec in base.items():
              rev = spec.get('revision', '')
              assert re.fullmatch(r'[0-9a-f]{40}', rev), f'Invalid commit SHA for {name}: {rev}'
          checkpoints = data.get('checkpoints') or []
          assert len(checkpoints) >= 5, 'Expected checkpoints in manifest'
          for cp in checkpoints:
              assert cp.get('id') and cp.get('role') and cp.get('target_endpoint')
          print(f'Manifest OK: {len(base)} base models, {len(checkpoints)} checkpoints')
          "

      - name: Smoke check core imports and graph compilation
        run: |
          python -c "
          from core.graph import build_research_rag_graph
          from core.supervisor import supervisor_planner
          from core.verifier import check_entity_value_binding, extract_numbers_and_years
          from modes.registry import MODE_MAP

          plan = supervisor_planner.plan_query('Compare Model A and Model B accuracy')
          assert plan.is_comparative_query is True
          graph = build_research_rag_graph('cpu_min', comparison_plan=True)
          assert graph is not None
          assert 'hybrid' in MODE_MAP and 'gpu_finetune' in MODE_MAP
          print('Core imports and StateGraph compilation OK')
          "

      - name: Smoke check FastAPI app health endpoints
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from api.app import app

          client = TestClient(app)
          for path in ('/health', '/api/health'):
              resp = client.get(path)
              assert resp.status_code == 200, f'{path} returned {resp.status_code}'
              assert resp.json().get('status') == 'ok'
          print('FastAPI /health and /api/health OK')
          "

      - name: Run M0 60-question mechanism regression gate
        run: |
          python main/eval/m0_regression_gate.py --output-dir /tmp/m0-gate
          python -c "
          import json
          with open('/tmp/m0-gate/m0_gate_report.json', encoding='utf-8') as f:
              report = json.load(f)
          assert report['passed'] is True
          assert report['good_passed'] == 60 and report['bad_traps_caught'] == 60
          print('M0 60-case gate OK:', report['clopper_pearson_95_lower_bound'])
          "

      - name: Run reproducible offline CPU pilot benchmark
        run: |
          python main/eval/run_benchmark.py --pilot --modes cpu_min --cache-regimes cold warm_no_cache --limit-per-cat 0 --output-dir /tmp/pilot-eval
          python -c "
          import json
          with open('/tmp/pilot-eval/benchmark_results.json', encoding='utf-8') as f:
              res = json.load(f)
          summaries = res['summaries']
          assert len(summaries) == 2
          for s in summaries:
              assert s['errors'] == []
              assert s['scored_questions'] == 4
              assert s['cache_hit_total'] == 0
              trap = next(r for r in s['records'] if r['id'] == 'pilot-unanswerable-vi')
              assert trap['abstention_accuracy'] == 1.0 and trap['hallucination_rate'] == 0.0, f'Trap audit failed: {trap}'
          print('Offline CPU pilot OK across cold and warm_no_cache regimes')
          "

      - name: Run full offline unit and integration pytest suite
        run: python -m pytest main/tests -q
